[project]
name = "simple-forms"
version = "0.1.0"
description = "Simple questionnaire webapp: NiceGUI UI + LLM-friendly REST API (modular monolith, API-first)"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0",
    "fastapi>=0.110",
    "sqlmodel>=0.0.16",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
    "slowapi>=0.1.10",
]
license = "MIT"
license-files = ["LICENSE"]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
